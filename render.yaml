# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy via the Render dashboard ("New > Blueprint") or the Render MCP server.
services:
  - type: web
    name: carnews-insta
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      # Secrets / connection strings — set in the Render dashboard or MCP.
      # DB lives on Neon, so DATABASE_URL is supplied here rather than provisioned.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POSTGRES_PRISMA_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
