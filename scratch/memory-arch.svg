<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="NanumBarunGothic, NanumGothic, sans-serif">
  <defs>
    <style>
      .title{font-family:NanumSquare,NanumBarunGothic,sans-serif;font-weight:bold;}
      .h{font-family:NanumSquare,NanumBarunGothic,sans-serif;font-weight:bold;}
      .t{font-family:NanumBarunGothic,sans-serif;}
      .mono{font-family:NanumGothicCoding,monospace;}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowB" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L9,3.2 L0,6.4 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#f8fafc"/>
  <text x="700" y="48" text-anchor="middle" class="title" font-size="34" fill="#0f172a">CARNEWS-INSTA 메모리 아키텍처</text>
  <text x="700" y="78" text-anchor="middle" class="t" font-size="16" fill="#64748b">요청 단위 작업기억 · 프로세스 단위 지식기억(RAG) · 2시간 세션기억</text>

  <!-- User -->
  <rect x="60" y="110" width="170" height="60" rx="10" fill="#1e293b"/>
  <text x="145" y="147" text-anchor="middle" class="h" font-size="18" fill="#fff">사용자</text>

  <!-- ③ Web / jobStore -->
  <rect x="280" y="100" width="1060" height="120" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="300" y="130" class="h" font-size="18" fill="#0e7490">③ 잡 세션 메모리 — Next.js 웹  ·  src/lib/jobStore.ts</text>
  <rect x="300" y="145" width="1020" height="58" rx="8" fill="#fff" stroke="#a5f3fc"/>
  <text x="320" y="172" class="mono" font-size="15" fill="#0f172a">Map&lt;id, Job&gt; { slides[], total, theme, createdAt }</text>
  <text x="320" y="194" class="t" font-size="14" fill="#475569">인메모리 · ⏱ 2시간 후 만료(cleanup) · 단일 프로세스 한정 · 서버 재시작 시 소실</text>

  <line x1="145" y1="170" x2="145" y2="160" stroke="#334155"/>
  <line x1="145" y1="140" x2="278" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- POST -->
  <line x1="700" y1="220" x2="700" y2="258" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="244" class="mono" font-size="13" fill="#475569">POST /generate</text>

  <!-- agent-service container -->
  <rect x="80" y="262" width="1240" height="560" rx="16" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="105" y="293" class="h" font-size="19" fill="#1e293b">agent-service  (LangGraph)</text>

  <!-- ① AgentState -->
  <rect x="110" y="312" width="1180" height="86" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="130" y="340" class="h" font-size="18" fill="#4338ca">① 작업 메모리 (단기) — AgentState : 모든 노드를 관통하는 가변 dict</text>
  <text x="130" y="368" class="mono" font-size="14" fill="#0f172a">topic · plan · copy · design_brief · image_prompt · critique · score · revision · revision_notes</text>
  <text x="130" y="390" class="t" font-size="13" fill="#475569">매 노드가 결과를 채우고 다음 노드가 읽음 · 요청 1건 동안만 생존(휘발성)</text>

  <!-- pipeline nodes -->
  <g class="h" font-size="15" fill="#fff" text-anchor="middle">
    <rect x="120" y="450" width="140" height="54" rx="9" fill="#3b82f6"/><text x="190" y="483">planner</text>
    <rect x="300" y="450" width="150" height="54" rx="9" fill="#3b82f6"/><text x="375" y="483">retriever</text>
    <rect x="490" y="450" width="160" height="54" rx="9" fill="#3b82f6"/><text x="570" y="483">copywriter</text>
    <rect x="690" y="450" width="150" height="54" rx="9" fill="#3b82f6"/><text x="765" y="483">designer</text>
    <rect x="880" y="450" width="150" height="54" rx="9" fill="#3b82f6"/><text x="955" y="483">image_gen</text>
    <rect x="1070" y="450" width="170" height="54" rx="9" fill="#8b5cf6"/><text x="1155" y="483">art_director</text>
  </g>
  <!-- forward arrows -->
  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <line x1="260" y1="477" x2="298" y2="477"/>
    <line x1="450" y1="477" x2="488" y2="477"/>
    <line x1="650" y1="477" x2="688" y2="477"/>
    <line x1="840" y1="477" x2="878" y2="477"/>
    <line x1="1030" y1="477" x2="1068" y2="477"/>
  </g>
  <!-- AgentState link hints -->
  <line x1="700" y1="398" x2="700" y2="448" stroke="#6366f1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- reviser loop -->
  <rect x="690" y="560" width="150" height="50" rx="9" fill="#dc2626"/>
  <text x="765" y="591" text-anchor="middle" class="h" font-size="15" fill="#fff">reviser</text>
  <path d="M1155 504 L1155 585 L842 585" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <text x="960" y="578" text-anchor="middle" class="t" font-size="13" fill="#b91c1c">score &lt; threshold 이면 루프백</text>
  <path d="M690 580 L600 580 L600 510" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <text x="500" y="552" class="t" font-size="12.5" fill="#b91c1c">revision_notes 기억하며 designer로 복귀</text>

  <!-- ② RAG store -->
  <rect x="120" y="640" width="560" height="160" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="140" y="670" class="h" font-size="18" fill="#047857">② 지식 메모리 (장기 / RAG) — TemplateStore</text>
  <text x="140" y="698" class="t" font-size="14" fill="#334155">• 싱글턴 _STORE — 프로세스당 1회 적재 후 캐시</text>
  <text x="140" y="722" class="t" font-size="14" fill="#334155">• 인스타 템플릿 45개(.jsonl) → 요약 → 임베딩 인덱스</text>
  <text x="140" y="746" class="t" font-size="14" fill="#334155">• 검색 폴백:</text>
  <text x="250" y="746" class="mono" font-size="13.5" fill="#0f172a">pgvector(미구현) ▷ 코사인 ▷ Jaccard 어휘</text>
  <text x="140" y="772" class="t" font-size="13" fill="#64748b">copywriter·designer에 few-shot 근거로 주입 · 재시작 시 재적재</text>
  <!-- retriever -> RAG -->
  <path d="M375 504 L375 530 L400 530 L400 638" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="412" y="560" class="mono" font-size="12.5" fill="#047857">search()</text>

  <!-- lifetime legend -->
  <rect x="720" y="640" width="570" height="160" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="740" y="668" class="h" font-size="16" fill="#0f172a">수명(lifetime) 비교</text>
  <text x="740" y="700" class="t" font-size="14" fill="#4338ca">① AgentState</text>
  <rect x="900" y="690" width="120" height="14" rx="3" fill="#6366f1"/>
  <text x="1035" y="701" class="t" font-size="12.5" fill="#64748b">요청 1건 → 소멸(휘발성)</text>
  <text x="740" y="732" class="t" font-size="14" fill="#047857">② RAG store</text>
  <rect x="900" y="722" width="300" height="14" rx="3" fill="#10b981"/>
  <text x="900" y="755" class="t" font-size="12" fill="#64748b">프로세스 생존 내내 → 재시작 시 재적재(영속화 미구현)</text>
  <text x="740" y="784" class="t" font-size="14" fill="#0e7490">③ jobStore</text>
  <rect x="900" y="774" width="160" height="14" rx="3" fill="#06b6d4"/>
  <text x="1075" y="785" class="t" font-size="12.5" fill="#64748b">2시간 → 만료/재시작 시 소실</text>

  <!-- footer note -->
  <text x="700" y="860" text-anchor="middle" class="t" font-size="15" fill="#475569">②·③ 모두 프로세스 인메모리 → 스케일아웃·컨테이너 재시작에 취약</text>
  <text x="700" y="888" text-anchor="middle" class="t" font-size="14" fill="#94a3b8">개선 여지: RAG는 pgvector 영속화, jobStore는 Redis/DB 이전 (prisma+pg 이미 의존성에 존재)</text>
</svg>
