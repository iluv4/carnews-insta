<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="940" viewBox="0 0 1260 940" font-family="'NanumGothic','NanumSquareRound',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1260" height="940" fill="#f8fafc"/>

  <!-- ============================= PANEL A ============================= -->
  <rect x="20" y="20" width="1220" height="430" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="58" font-size="22" font-weight="700" fill="#0f172a">(a) Fan-out · Map-Reduce  —  구현 완료 (PR #34)</text>
  <text x="44" y="84" font-size="14" fill="#64748b">슬라이드 수만큼 병렬로 카드를 만들고(Send) → 하나로 합친다(reducer).  N장 덱 ≈ 1장 시간.</text>

  <!-- linear head -->
  <g>
    <rect x="44"  y="200" width="118" height="46" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="103" y="228" font-size="14" text-anchor="middle" fill="#1e3a8a">planner</text>
    <rect x="184" y="200" width="118" height="46" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="243" y="228" font-size="14" text-anchor="middle" fill="#1e3a8a">retriever</text>
    <rect x="324" y="200" width="124" height="46" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="386" y="222" font-size="14" text-anchor="middle" fill="#1e3a8a">copywriter</text>
    <text x="386" y="238" font-size="10" text-anchor="middle" fill="#64748b">(전 슬라이드 카피)</text>
  </g>
  <line x1="162" y1="223" x2="182" y2="223" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="302" y1="223" x2="322" y2="223" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- fan-out label -->
  <text x="520" y="118" font-size="13" font-weight="700" fill="#7c3aed">① Send  —  슬라이드마다 1브랜치 병렬 디스패치</text>

  <!-- three parallel render_slide branches -->
  <g>
    <rect x="560" y="130" width="300" height="62" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="574" y="153" font-size="13" font-weight="700" fill="#5b21b6">render_slide(0)  ·  커버</text>
    <text x="574" y="174" font-size="10.5" fill="#6d28d9">designer→image_gen→art_director → reviser ↺</text>
    <text x="574" y="187" font-size="9.5" fill="#94a3b8">(카드 단위 자기수정 루프: 점수 >= 기준까지)</text>

    <rect x="560" y="206" width="300" height="62" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="574" y="229" font-size="13" font-weight="700" fill="#5b21b6">render_slide(1)  ·  info</text>
    <text x="574" y="250" font-size="10.5" fill="#6d28d9">designer→image_gen→art_director → reviser ↺</text>
    <text x="574" y="263" font-size="9.5" fill="#94a3b8">(독립 상태 sub = 이 슬라이드 1장)</text>

    <rect x="560" y="282" width="300" height="62" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="574" y="305" font-size="13" font-weight="700" fill="#5b21b6">render_slide(2)  ·  cta</text>
    <text x="574" y="326" font-size="10.5" fill="#6d28d9">designer→image_gen→art_director → reviser ↺</text>
    <text x="574" y="339" font-size="9.5" fill="#94a3b8">→ 반환: {"cards":[card]}</text>
  </g>

  <!-- copywriter -> 3 branches -->
  <path d="M448,223 C500,223 510,161 558,161" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M448,223 L558,237" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M448,223 C500,223 510,313 558,313" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- collect -->
  <rect x="940" y="200" width="120" height="48" rx="9" fill="#ecfeff" stroke="#06b6d4"/>
  <text x="1000" y="222" font-size="14" text-anchor="middle" fill="#0e7490">collect</text>
  <text x="1000" y="238" font-size="9.5" text-anchor="middle" fill="#64748b">정렬 · fan-in</text>

  <!-- 3 branches -> collect -->
  <path d="M860,161 C905,161 905,219 938,219" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M860,237 L938,224" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M860,313 C905,313 905,229 938,229" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="905" y="370" font-size="13" font-weight="700" fill="#0e7490">② reducer (operator.add) — 브랜치 결과 cards 이어붙임</text>

  <!-- END -->
  <circle cx="1110" cy="224" r="22" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1110" y="228" font-size="12" text-anchor="middle" fill="#475569">END</text>
  <line x1="1060" y1="224" x2="1086" y2="224" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============================= PANEL B ============================= -->
  <rect x="20" y="478" width="1220" height="440" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="516" font-size="22" font-weight="700" fill="#0f172a">(b) Human-in-the-loop  —  개념 (미구현)</text>
  <text x="44" y="542" font-size="14" fill="#64748b">자동 재생성 대신 사람이 검수/승인. 그래프를 <tspan font-weight="700" fill="#ea580c">멈췄다가(interrupt)</tspan> 사람 입력으로 <tspan font-weight="700" fill="#16a34a">재개</tspan>.</text>

  <!-- condensed pipeline -->
  <rect x="44" y="640" width="300" height="56" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="194" y="666" font-size="13" text-anchor="middle" fill="#1e3a8a">planner→…→fan-out→collect</text>
  <text x="194" y="684" font-size="10" text-anchor="middle" fill="#64748b">(a)의 파이프라인 그대로</text>

  <!-- review gate (interrupt) -->
  <rect x="408" y="632" width="210" height="72" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="513" y="660" font-size="14" font-weight="700" text-anchor="middle" fill="#9a3412">review_gate</text>
  <text x="513" y="680" font-size="12" text-anchor="middle" fill="#c2410c">‖ interrupt()</text>
  <text x="513" y="695" font-size="9.5" text-anchor="middle" fill="#94a3b8">여기서 그래프 일시정지</text>
  <line x1="344" y1="668" x2="406" y2="668" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- checkpointer cylinder -->
  <g>
    <ellipse cx="513" cy="772" rx="58" ry="12" fill="#e0f2fe" stroke="#0284c7"/>
    <path d="M455,772 L455,808 A58,12 0 0,0 571,808 L571,772" fill="#e0f2fe" stroke="#0284c7"/>
    <ellipse cx="513" cy="772" rx="58" ry="12" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="513" y="795" font-size="11.5" text-anchor="middle" fill="#075985">checkpointer</text>
    <text x="513" y="810" font-size="9.5" text-anchor="middle" fill="#64748b">상태 저장 (Postgres)</text>
  </g>
  <line x1="513" y1="704" x2="513" y2="758" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="523" y="734" font-size="9.5" fill="#0284c7">매 step 저장</text>

  <!-- human -->
  <circle cx="700" cy="600" r="14" fill="#dcfce7" stroke="#16a34a"/>
  <text x="700" y="605" font-size="14" text-anchor="middle"></text>
  <text x="700" y="636" font-size="11" text-anchor="middle" fill="#15803d">사람 검수</text>
  <path d="M560,632 C600,600 650,600 684,600" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrowO)"/>
  <text x="566" y="612" font-size="9.5" fill="#ea580c">제안 카드+비평 전달</text>

  <!-- approve -> END -->
  <path d="M700,614 C760,650 820,668 900,668" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="800" y="648" font-size="12" font-weight="700" fill="#16a34a">승인 → 재개</text>
  <circle cx="940" cy="668" r="22" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="940" y="672" font-size="12" text-anchor="middle" fill="#475569">END</text>

  <!-- revise loop back -->
  <path d="M513,704 C513,860 250,860 194,860 C120,860 120,720 194,700 L194,698" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowO)"/>
  <text x="300" y="878" font-size="12" font-weight="700" fill="#ea580c">수정 지시(예: "디자인만 다시 / 카피 OK") → 부분 재생성</text>

  <!-- API callout -->
  <rect x="660" y="720" width="540" height="150" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="680" y="746" font-size="13" font-weight="700" fill="#334155">⚠ 비용: API가 1콜 → 2콜 + 세션 상태로 바뀜</text>
  <text x="680" y="776" font-size="12.5" fill="#475569" font-family="'NanumGothicCoding',monospace">POST /generate  → ⏸ interrupt 에서 멈춤</text>
  <text x="700" y="794" font-size="11" fill="#94a3b8" font-family="'NanumGothicCoding',monospace">↳ "검수 대기" + thread_id 반환</text>
  <text x="680" y="822" font-size="12.5" fill="#475569" font-family="'NanumGothicCoding',monospace">POST /resume   → thread_id + 사람 결정</text>
  <text x="700" y="840" font-size="11" fill="#94a3b8" font-family="'NanumGothicCoding',monospace">↳ 멈춘 지점부터 그래프 재개</text>
  <text x="680" y="862" font-size="11" fill="#16a34a">+ 프론트에 "검수 화면" 필요</text>
</svg>
