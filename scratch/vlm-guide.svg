<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1480" viewBox="0 0 1100 1480" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1100" height="1480" fill="url(#bg)"/>

  <!-- Title -->
  <text x="550" y="58" text-anchor="middle" fill="#f8fafc" font-size="34" font-weight="700">VLM Selection &amp; Fine-Tuning — for your CardNews service</text>
  <text x="550" y="92" text-anchor="middle" fill="#94a3b8" font-size="18">"dipstick" = DeepSeek-VL · "llama" = Llama Vision · (also meet Qwen2.5-VL ⭐)</text>

  <!-- ===== SECTION 1: What a VLM does ===== -->
  <g>
    <rect x="40" y="120" width="1020" height="250" rx="18" fill="url(#card)" filter="url(#sh)"/>
    <text x="68" y="158" fill="#0f172a" font-size="22" font-weight="700">1 · What a VLM does in YOUR pipeline</text>

    <!-- flow boxes -->
    <rect x="70" y="190" width="170" height="80" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="155" y="222" text-anchor="middle" fill="#1e3a8a" font-size="16" font-weight="600">🖼️ Image in</text>
    <text x="155" y="246" text-anchor="middle" fill="#1e3a8a" font-size="13">card / reference</text>

    <text x="262" y="238" text-anchor="middle" fill="#475569" font-size="30">→</text>

    <rect x="290" y="190" width="200" height="80" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="390" y="222" text-anchor="middle" fill="#5b21b6" font-size="16" font-weight="700">👁️ VLM</text>
    <text x="390" y="246" text-anchor="middle" fill="#5b21b6" font-size="13">"sees" + reasons</text>

    <text x="512" y="238" text-anchor="middle" fill="#475569" font-size="30">→</text>

    <rect x="540" y="190" width="200" height="80" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="640" y="222" text-anchor="middle" fill="#166534" font-size="16" font-weight="600">📝 Text out</text>
    <text x="640" y="246" text-anchor="middle" fill="#166534" font-size="13">critique / score</text>

    <!-- where used -->
    <rect x="770" y="185" width="260" height="160" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="900" y="212" text-anchor="middle" fill="#92400e" font-size="15" font-weight="700">Used in your app at:</text>
    <text x="790" y="244" fill="#7c2d12" font-size="14">• art_director (디자인 비평)</text>
    <text x="790" y="272" fill="#7c2d12" font-size="14">• reference 분석 (45 templates)</text>
    <text x="790" y="300" fill="#7c2d12" font-size="14">• OCR of Korean copy</text>
    <text x="790" y="328" fill="#7c2d12" font-size="13" font-style="italic">today = GPT-5.5 vision</text>

    <text x="70" y="318" fill="#334155" font-size="15">Key question for you →  "Which model judges Korean design</text>
    <text x="70" y="342" fill="#334155" font-size="15">aesthetics + reads Korean text-in-image the best?"</text>
  </g>

  <!-- ===== SECTION 2: Model comparison ===== -->
  <g>
    <rect x="40" y="392" width="1020" height="360" rx="18" fill="url(#card)" filter="url(#sh)"/>
    <text x="68" y="430" fill="#0f172a" font-size="22" font-weight="700">2 · Model comparison</text>

    <!-- table header -->
    <rect x="68" y="450" width="964" height="40" rx="8" fill="#1e293b"/>
    <text x="150" y="476" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Model</text>
    <text x="430" y="476" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Strength</text>
    <text x="720" y="476" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Weak spot</text>
    <text x="930" y="476" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">License</text>

    <!-- row 1 DeepSeek -->
    <rect x="68" y="492" width="964" height="56" fill="#f8fafc"/>
    <text x="80" y="518" fill="#0f172a" font-size="15" font-weight="700">DeepSeek-VL2</text>
    <text x="80" y="538" fill="#64748b" font-size="12">"dipstick"</text>
    <text x="300" y="525" fill="#334155" font-size="14">Strong OCR / text-in-image, detail</text>
    <text x="620" y="525" fill="#334155" font-size="14">smaller community</text>
    <text x="930" y="525" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="600">MIT ✓</text>

    <!-- row 2 Llama -->
    <rect x="68" y="548" width="964" height="56" fill="#eef2ff"/>
    <text x="80" y="574" fill="#0f172a" font-size="15" font-weight="700">Llama 3.2 Vision</text>
    <text x="80" y="594" fill="#64748b" font-size="12">11B / 90B</text>
    <text x="300" y="581" fill="#334155" font-size="14">Huge ecosystem, easy tooling</text>
    <text x="620" y="581" fill="#334155" font-size="14">weaker Korean OCR</text>
    <text x="930" y="581" text-anchor="middle" fill="#d97706" font-size="14" font-weight="600">limited ⚠</text>

    <!-- row 3 Qwen -->
    <rect x="68" y="604" width="964" height="56" fill="#ecfdf5"/>
    <text x="80" y="630" fill="#0f172a" font-size="15" font-weight="700">Qwen2.5-VL ⭐</text>
    <text x="80" y="650" fill="#64748b" font-size="12">7B / 72B</text>
    <text x="300" y="637" fill="#334155" font-size="14">Best open OCR + Korean + design</text>
    <text x="620" y="637" fill="#334155" font-size="14">—</text>
    <text x="930" y="637" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="600">Apache ✓</text>

    <!-- verdict -->
    <rect x="68" y="676" width="964" height="56" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="84" y="699" fill="#991b1b" font-size="14" font-weight="700">⚠ Honest truth:</text>
    <text x="84" y="721" fill="#7f1d1d" font-size="14">Open models win at "what's in the image". For TASTE (is it beautiful?), GPT-5.5 still leads → keep it for art_director.</text>
  </g>

  <!-- ===== SECTION 3: Fine-tuning flow ===== -->
  <g>
    <rect x="40" y="774" width="1020" height="430" rx="18" fill="url(#card)" filter="url(#sh)"/>
    <text x="68" y="812" fill="#0f172a" font-size="22" font-weight="700">3 · How fine-tuning (파인튜닝) works — the LoRA + distillation path</text>

    <!-- step 1 -->
    <rect x="68" y="840" width="220" height="150" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="178" y="872" text-anchor="middle" fill="#1e3a8a" font-size="40">🧑‍🏫</text>
    <text x="178" y="908" text-anchor="middle" fill="#1e3a8a" font-size="16" font-weight="700">1. Make data</text>
    <text x="178" y="934" text-anchor="middle" fill="#1e40af" font-size="13">GPT-5.5 labels your</text>
    <text x="178" y="954" text-anchor="middle" fill="#1e40af" font-size="13">cards → critiques</text>
    <text x="178" y="976" text-anchor="middle" fill="#3b82f6" font-size="12" font-style="italic">= "distillation"</text>

    <text x="300" y="922" text-anchor="middle" fill="#475569" font-size="34">→</text>

    <!-- step 2 -->
    <rect x="330" y="840" width="220" height="150" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="440" y="872" text-anchor="middle" fill="#5b21b6" font-size="40">🎓</text>
    <text x="440" y="908" text-anchor="middle" fill="#5b21b6" font-size="16" font-weight="700">2. Train (LoRA)</text>
    <text x="440" y="934" text-anchor="middle" fill="#6d28d9" font-size="13">trains ~1% of model</text>
    <text x="440" y="954" text-anchor="middle" fill="#6d28d9" font-size="13">1× RTX 4090 (24GB)</text>
    <text x="440" y="976" text-anchor="middle" fill="#8b5cf6" font-size="12" font-style="italic">LLaMA-Factory / Unsloth</text>

    <text x="562" y="922" text-anchor="middle" fill="#475569" font-size="34">→</text>

    <!-- step 3 -->
    <rect x="592" y="840" width="220" height="150" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="702" y="872" text-anchor="middle" fill="#166534" font-size="40">🚀</text>
    <text x="702" y="908" text-anchor="middle" fill="#166534" font-size="16" font-weight="700">3. Host + serve</text>
    <text x="702" y="934" text-anchor="middle" fill="#15803d" font-size="13">Vercel = no GPU, so</text>
    <text x="702" y="954" text-anchor="middle" fill="#15803d" font-size="13">call over an API</text>
    <text x="702" y="976" text-anchor="middle" fill="#22c55e" font-size="12" font-style="italic">Replicate / Modal / RunPod</text>

    <text x="824" y="922" text-anchor="middle" fill="#475569" font-size="34">→</text>

    <!-- result -->
    <rect x="854" y="840" width="178" height="150" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
    <text x="943" y="872" text-anchor="middle" fill="#854d0e" font-size="40">💰</text>
    <text x="943" y="908" text-anchor="middle" fill="#854d0e" font-size="16" font-weight="700">Result</text>
    <text x="943" y="934" text-anchor="middle" fill="#a16207" font-size="13">small cheap model</text>
    <text x="943" y="954" text-anchor="middle" fill="#a16207" font-size="13">that copies the</text>
    <text x="943" y="974" text-anchor="middle" fill="#a16207" font-size="13">big one's behavior</text>

    <!-- do you need it -->
    <rect x="68" y="1010" width="964" height="50" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="84" y="1031" fill="#075985" font-size="14" font-weight="700">❓ Do you even need it?</text>
    <text x="84" y="1052" fill="#0c4a6e" font-size="14">You already have RAG (45 templates as few-shot). RAG + good prompts solves ~80%. Fine-tune only for consistent rubric or cost.</text>

    <!-- two doors -->
    <rect x="68" y="1076" width="466" height="108" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="84" y="1104" fill="#6b21a8" font-size="15" font-weight="700">Path A · Open-source (control + cost)</text>
    <text x="84" y="1130" fill="#581c87" font-size="13">Qwen2.5-VL-7B  +  LoRA via LLaMA-Factory</text>
    <text x="84" y="1152" fill="#581c87" font-size="13">+ labels distilled from GPT-5.5</text>
    <text x="84" y="1174" fill="#9333ea" font-size="12" font-style="italic">needs a GPU / host budget</text>

    <rect x="566" y="1076" width="466" height="108" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="582" y="1104" fill="#166534" font-size="15" font-weight="700">Path B · Least effort</text>
    <text x="582" y="1130" fill="#14532d" font-size="13">OpenAI managed vision fine-tuning</text>
    <text x="582" y="1152" fill="#14532d" font-size="13">no GPU, stays on your current stack</text>
    <text x="582" y="1174" fill="#16a34a" font-size="12" font-style="italic">upload examples → get endpoint</text>
  </g>

  <!-- ===== Recommendation banner ===== -->
  <g>
    <rect x="40" y="1226" width="1020" height="210" rx="18" fill="#0f766e" filter="url(#sh)"/>
    <text x="68" y="1266" fill="#f0fdfa" font-size="22" font-weight="700">✅ My recommendation for you</text>
    <text x="68" y="1306" fill="#ccfbf1" font-size="17">1.  Don't fine-tune yet — strengthen prompts + your existing RAG first (cheapest win).</text>
    <text x="68" y="1342" fill="#ccfbf1" font-size="17">2.  Want open-source? Start with <tspan font-weight="700">Qwen2.5-VL-7B</tspan> (beats DeepSeek &amp; Llama for Korean).</text>
    <text x="68" y="1378" fill="#ccfbf1" font-size="17">3.  Want least effort? Use OpenAI vision fine-tuning — no infra, stay on Vercel.</text>
    <text x="68" y="1414" fill="#5eead4" font-size="16" font-style="italic">Next step idea: I can write a script that turns your 45 templates into training data using GPT-5.5. 🚗</text>
  </g>
</svg>
