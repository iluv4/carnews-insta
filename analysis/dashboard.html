<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인스타 레퍼런스 모니터링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{ --bg:#0b0b0f; --card:#16161d; --line:#26262f; --txt:#f4f4f6; --sub:#9aa0a6; --red:#E50914; --accent:#ff6b35; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--bg); color:var(--txt); font-family:'Pretendard',sans-serif; padding:32px 20px 80px; }
  .wrap{ max-width:1100px; margin:0 auto; }
  header.top{ display:flex; align-items:center; gap:16px; margin-bottom:8px; }
  header.top h1{ font-size:24px; font-weight:800; letter-spacing:-.5px; }
  .badge{ background:var(--red); color:#fff; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; }
  .sub{ color:var(--sub); font-size:14px; margin-bottom:24px; }
  .searchbar{ display:flex; gap:8px; margin-bottom:28px; }
  .searchbar input{ flex:1; background:var(--card); border:1px solid var(--line); color:var(--txt); padding:13px 16px; border-radius:12px; font-size:15px; font-family:inherit; }
  .searchbar button{ background:var(--red); color:#fff; border:none; padding:0 22px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer; }
  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .kpi .label{ color:var(--sub); font-size:13px; margin-bottom:8px; }
  .kpi .val{ font-size:26px; font-weight:800; letter-spacing:-1px; }
  .kpi .val small{ font-size:14px; color:var(--sub); font-weight:500; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .panel h3{ font-size:15px; font-weight:700; margin-bottom:16px; }
  .panel canvas{ max-height:260px; }
  .insight{ background:linear-gradient(135deg,#1d1420,#16161d); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:28px; }
  .insight h3{ font-size:15px; margin-bottom:12px; }
  .insight ul{ list-style:none; display:flex; flex-direction:column; gap:10px; }
  .insight li{ font-size:14px; color:#d7d7db; padding-left:22px; position:relative; line-height:1.5; }
  .insight li::before{ content:'▸'; color:var(--accent); position:absolute; left:0; }
  .insight b{ color:var(--txt); }
  h2.section{ font-size:18px; font-weight:800; margin:8px 0 16px; }
  .gallery{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .post{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; transition:.15s; }
  .post:hover{ transform:translateY(-3px); border-color:var(--red); }
  .post .type{ font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.5px; }
  .post .cap{ font-size:13px; margin:8px 0 12px; line-height:1.45; min-height:56px; }
  .post .stat{ font-size:13px; color:var(--sub); display:flex; justify-content:space-between; }
  .post .stat b{ color:var(--red); font-size:15px; }
  .viral{ outline:2px solid var(--red); }
  footer{ color:var(--sub); font-size:12px; text-align:center; margin-top:40px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>📈 인스타 레퍼런스 모니터링</h1>
    <span class="badge">LIVE</span>
  </header>
  <p class="sub">벤치마크 계정의 게시물 인게이지먼트를 추적하고, 어떤 콘텐츠가 뜨는지 분석합니다.</p>

  <div class="searchbar">
    <input id="acct" value="@netflix" placeholder="모니터링할 계정 입력 (예: @netflix)">
    <button onclick="alert('데모 버전입니다. 실제 서비스에서는 입력한 계정의 최신 게시물을 실시간으로 불러옵니다.')">분석하기</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="insight" id="insight"></div>

  <div class="grid2">
    <div class="panel"><h3>좋아요 추이 (게시물별)</h3><canvas id="trend"></canvas></div>
    <div class="panel"><h3>콘텐츠 포맷별 평균 좋아요</h3><canvas id="fmt"></canvas></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>조회수 → 좋아요 (릴스)</h3><canvas id="scatter"></canvas></div>
    <div class="panel"><h3>게시 시간대(KST)별 좋아요</h3><canvas id="hour"></canvas></div>
  </div>

  <h2 class="section">🖼️ 레퍼런스 갤러리 (좋아요순)</h2>
  <div class="gallery" id="gallery"></div>

  <footer>데이터 출처: Instagram (Looter API) · @netflix 게시물 12건 · 데모</footer>
</div>

<script>
const TYPE_KO = { photo:'사진', reel:'릴스', carousel:'캐러셀' };
const posts = [
  {t:1779285601,type:'carousel',likes:22607,comments:6933,plays:0,cap:'6월 라인업이 햇살과 잘 어울리는 이유'},
  {t:1780956002,type:'carousel',likes:88986,comments:293,plays:0,cap:'스트레인저 띵스 × 더 버로우즈 평행이론'},
  {t:1780948805,type:'reel',likes:8000,comments:263,plays:517736,cap:'오피스 로맨스 - 우주의 단 하나의 별'},
  {t:1780941605,type:'reel',likes:17409,comments:246,plays:600363,cap:'콜먼 도밍고 - 더 포 시즌스'},
  {t:1780938005,type:'reel',likes:15301,comments:166,plays:780173,cap:"굿 걸스 가이드 투 머더 S2"},
  {t:1780930803,type:'photo',likes:195974,comments:520,plays:0,cap:'에놀라의 표정을 확대해보세요'},
  {t:1780927208,type:'reel',likes:263936,comments:2420,plays:4211923,cap:'스쿠비가 실사로! 스쿠비-두 오리진스'},
  {t:1780855200,type:'carousel',likes:57976,comments:478,plays:0,cap:'더 포 시즌스 S2, 웃음 폭발'},
  {t:1780851602,type:'carousel',likes:100559,comments:386,plays:0,cap:'근데 왜 저 사람이 웃고 있지?'},
  {t:1780848005,type:'reel',likes:245662,comments:4632,plays:14897034,cap:'오피스 로맨스 지금 방영중'},
  {t:1780776004,type:'reel',likes:211051,comments:1768,plays:4690955,cap:'아바타: 라스트 에어벤더 시즌2'},
  {t:1780772406,type:'reel',likes:92858,comments:596,plays:1827673,cap:'모든 우주에서 전설'},
];
const fmtK = n => n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+'K' : n;
const sorted = [...posts].sort((a,b)=>a.t-b.t);
const mean = posts.reduce((s,p)=>s+p.likes,0)/posts.length;
const top = [...posts].sort((a,b)=>b.likes-a.likes)[0];
const reels = posts.filter(p=>p.plays>0);

// KPIs
document.getElementById('kpis').innerHTML = [
  ['게시물', posts.length+'건'],
  ['평균 좋아요', fmtK(Math.round(mean))],
  ['최고 좋아요', fmtK(top.likes)],
  ['릴스 평균 조회', fmtK(Math.round(reels.reduce((s,p)=>s+p.plays,0)/reels.length))],
].map(([l,v])=>`<div class="kpi"><div class="label">${l}</div><div class="val">${v}</div></div>`).join('');

// Insight
const avgByType = {};
['photo','reel','carousel'].forEach(t=>{const a=posts.filter(p=>p.type===t);if(a.length)avgByType[t]=a.reduce((s,p)=>s+p.likes,0)/a.length;});
const bestFmt = Object.entries(avgByType).sort((a,b)=>b[1]-a[1])[0];
// correlation plays vs likes
const mx=reels.reduce((s,p)=>s+p.plays,0)/reels.length, my=reels.reduce((s,p)=>s+p.likes,0)/reels.length;
let num=0,dx=0,dy=0; reels.forEach(p=>{num+=(p.plays-mx)*(p.likes-my);dx+=(p.plays-mx)**2;dy+=(p.likes-my)**2;});
const r=(num/Math.sqrt(dx*dy)).toFixed(2);
document.getElementById('insight').innerHTML = `<h3>💡 자동 인사이트</h3><ul>
  <li>가장 반응 좋은 포맷은 <b>${TYPE_KO[bestFmt[0]]}</b> (평균 ${fmtK(Math.round(bestFmt[1]))} 좋아요) — 다음 콘텐츠 기획 시 우선 고려.</li>
  <li>최고 게시물: <b>"${top.cap}"</b> — ${top.likes.toLocaleString()} 좋아요로 평균의 ${(top.likes/mean).toFixed(1)}배.</li>
  <li>릴스 <b>조회수↔좋아요 상관계수 r=${r}</b> — 도달이 늘면 좋아요도 비례 증가. 초기 도달 확보가 핵심.</li>
</ul>`;

const gridC='#26262f', txtC='#9aa0a6';
Chart.defaults.color=txtC; Chart.defaults.font.family='Pretendard';

new Chart(trend,{type:'line',data:{labels:sorted.map(p=>new Date(p.t*1000).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})),
  datasets:[{data:sorted.map(p=>p.likes),borderColor:'#E50914',backgroundColor:'rgba(229,9,20,.1)',fill:true,tension:.3,pointRadius:4}]},
  options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:gridC}},y:{grid:{color:gridC},ticks:{callback:fmtK}}}}});

new Chart(fmt,{type:'bar',data:{labels:Object.keys(avgByType).map(t=>TYPE_KO[t]),
  datasets:[{data:Object.values(avgByType),backgroundColor:['#9aa0a6','#E50914','#564d4d']}]},
  options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{grid:{color:gridC},ticks:{callback:fmtK}}}}});

new Chart(scatter,{type:'scatter',data:{datasets:[{data:reels.map(p=>({x:p.plays,y:p.likes})),backgroundColor:'#E50914',pointRadius:7}]},
  options:{plugins:{legend:{display:false}},scales:{x:{type:'logarithmic',grid:{color:gridC},ticks:{callback:fmtK},title:{display:true,text:'조회수(log)'}},y:{grid:{color:gridC},ticks:{callback:fmtK}}}}});

new Chart(hour,{type:'scatter',data:{datasets:[{data:posts.map(p=>({x:new Date(p.t*1000+9*3600*1000).getUTCHours(),y:p.likes})),backgroundColor:'#ff6b35',pointRadius:7}]},
  options:{plugins:{legend:{display:false}},scales:{x:{min:0,max:23,grid:{color:gridC},title:{display:true,text:'시(KST)'}},y:{grid:{color:gridC},ticks:{callback:fmtK}}}}});

// Gallery
document.getElementById('gallery').innerHTML = [...posts].sort((a,b)=>b.likes-a.likes).map(p=>`
  <div class="post ${p.likes>mean*2?'viral':''}">
    <div class="type">${TYPE_KO[p.type]}${p.likes>mean*2?' · 🔥인기':''}</div>
    <div class="cap">${p.cap}</div>
    <div class="stat"><span>❤️ <b>${fmtK(p.likes)}</b></span><span>💬 ${fmtK(p.comments)}</span></div>
  </div>`).join('');
</script>
</body>
</html>
